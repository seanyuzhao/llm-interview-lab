name: Verify static site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate questions and assets
        run: python3 scripts/verify_site.py
      - name: Check scripts
        run: |
          node --check assets/app.js
          node --check assets/math.js
          node --check data/math_patches.js
          node scripts/verify_math.cjs
          node --check data/questions.js
          node --check data/formulas.js
